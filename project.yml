name: Conclawd
options:
  bundleIdPrefix: com.conclawd
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true
  # XcodeGen has no option for the scheme's Queue Debugging setting; patch it in
  # after generation. Leaving it on deadlocks forkpty (see the script's comment).
  postGenCommand: bash Scripts/disable-queue-debugging.sh

# Sign with a stable identity so TCC grants (Desktop/Documents access, etc.)
# survive rebuilds. Ad-hoc/unsigned builds get a new CDHash every build, which
# makes macOS re-prompt for permissions each time.
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: 8LG94A3CX7

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
  Yams:
    url: https://github.com/jpsim/Yams
    from: 5.0.0
  Highlightr:
    url: https://github.com/raspu/Highlightr
    from: 2.1.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0

targets:
  Conclawd:
    type: application
    platform: macOS
    sources:
      - path: Conclawd
        excludes:
          - Resources/MultilingualE5Small.mlpackage
          - Resources/MultilingualE5Small.mlmodelc
          - Resources/e5_tokenizer
      - path: Conclawd/Resources/MultilingualE5Small.mlmodelc
        type: folder
        buildPhase: resources
      - path: Conclawd/Resources/e5_tokenizer
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conclawd.app
        PRODUCT_NAME: Conclawd
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_CFBundleDisplayName: Conclawd
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_APP_SANDBOX: NO
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SwiftTerm
      - package: Yams
      - package: Highlightr
      - package: GRDB
      - sdk: CoreML.framework
      # SDK 26.x のautolinkでは import AVKit が _AVKit_SwiftUI しかリンクせず、
      # 実行時に AVPlayerView が未ロードで VideoPlayer 表示時にクラッシュするため明示リンク
      - sdk: AVKit.framework
      - target: ConclawdCtl
        embed: false
    postBuildScripts:
      - name: Bundle conclawd helper CLI
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          cp -f "${BUILT_PRODUCTS_DIR}/conclawd" "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/conclawd"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/conclawd
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/conclawd

  ConclawdCtl:
    type: tool
    platform: macOS
    sources:
      - path: ConclawdCtl
      - path: Conclawd/Services/SessionControlProtocol.swift
    settings:
      base:
        PRODUCT_NAME: conclawd
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  ConclawdEmbed:
    type: tool
    platform: macOS
    sources:
      - path: ConclawdEmbed
      - path: Conclawd/Vendor/Tokenizers
    settings:
      base:
        PRODUCT_NAME: conclawd-embed
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - sdk: CoreML.framework

  ConclawdTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ConclawdTests
    dependencies:
      - target: Conclawd
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Conclawd:
    build:
      targets:
        Conclawd: all
    run:
      config: Debug
      environmentVariables:
        - variable: OS_ACTIVITY_DT_MODE
          value: "NO"
          isEnabled: true
    test:
      config: Debug
      targets:
        - ConclawdTests
    profile:
      config: Release
