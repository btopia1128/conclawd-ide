name: Release

# Pushing to main with a bumped MARKETING_VERSION in project.yml triggers a full
# release: build -> sign -> notarize -> DMG -> R2 upload (LP download) -> GitHub Release.
# If the version already has a GitHub Release, the release job is skipped.
#
# Required repository secrets:
#   MACOS_CERT_P12       - Developer ID Application certificate (.p12, base64)
#   MACOS_CERT_PASSWORD  - password for the .p12
#   APPLE_ID             - Apple ID email for notarization
#   APPLE_TEAM_ID        - Apple Developer Team ID (8LG94A3CX7)
#   APPLE_APP_PASSWORD   - app-specific password (account.apple.com)
#   CLOUDFLARE_API_TOKEN - token with R2 write access to the conclawd-downloads bucket
#   CLOUDFLARE_ACCOUNT_ID- Cloudflare account ID

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      is-new: ${{ steps.check.outputs.is-new }}
    steps:
      - uses: actions/checkout@v4
      - name: Compare project.yml version with latest GitHub Release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' project.yml | head -1)
          if [[ -z "$VERSION" ]]; then
            echo "error: could not read MARKETING_VERSION from project.yml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION already released — skipping"
            echo "is-new=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION is new — releasing"
            echo "is-new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.is-new == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN=$RUNNER_TEMP/release.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build, sign, notarize, package, upload
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: Scripts/release.sh

      - name: Extract changelog section
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ {flag=0}
            flag' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            "build/dist/Conclawd-$VERSION.dmg" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
